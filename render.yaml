# traceX public exchange on Render, one click:
#   https://render.com/deploy?repo=https://github.com/matthewcauble-boop/traceex
#
# One web service runs everything: the website (/), the API (/v0), the MCP endpoint for agents (/mcp) and the
# epoch clock (clears the auctions and settles once a day). The database is SQLite on a 1 GB persistent disk, so a
# redeploy keeps every trace, bounty and wallet. A disk needs a paid instance: 0.5c-512mb (formerly Starter) is the
# smallest, $7/month, plus $0.25/GB/month for the disk.
# It runs as a testnet: every wallet takes $25 of test credits once, and no real money moves. See DEPLOY.md.
services:
  - type: web
    name: tracex
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install ./sdk/python
    startCommand: python node/exchange.py
    healthCheckPath: /healthz
    disk:
      name: tracex-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TRACEX_DB
        value: /var/data/exchange.db
      - key: TRACEX_PUBLIC                 # rate limits on; operator-only calls need the admin token
        value: "1"
      - key: TRACEX_SEED                   # first boot only: load the repo's worked examples
        value: "1"
      - key: TRACEX_TEST_CREDITS           # $25 of test credits per new wallet, in micros
        value: "25000000"
      - key: TRACEX_EPOCH_HOURS            # clear auctions and settle every 24 h
        value: "24"
      - key: TRACEX_RESERVE_MICROS         # reserve price per licence in a lot auction ($0.05)
        value: "50000"
      - key: TRACEX_MAX_DB_MB              # stop new writes before the 1 GB disk fills
        value: "800"
      - key: TRACEX_ADMIN_TOKEN            # generated by Render; copy it to your password manager
        generateValue: true
