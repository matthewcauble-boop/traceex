[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceex"
version = "0.1.0"
description = "Share verified model fixes (traces) on traceX, and adopt the learnings built from them."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
traceex-mcp = "traceex.mcp:main"
traceex-outbox = "traceex.outbox:main"

[project.entry-points.pytest11]
traceex = "traceex.pytest_plugin"

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.20"]

[tool.setuptools]
packages = ["traceex"]
