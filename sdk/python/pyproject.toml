[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceex"
version = "0.1.0"
description = "Share verified model fixes (traces) on traceX, and adopt the learnings built from them."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
traceex-mcp = "traceex.mcp:main"

[tool.setuptools]
packages = ["traceex"]
