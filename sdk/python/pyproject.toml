[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceex"
version = "0.1.0"
description = "Share verified model fixes (traces) on the Trace Exchange, and adopt the learnings built from them."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools]
packages = ["traceex"]
